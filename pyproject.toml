[project]
name = "botcan"
version = "0.2.0"
description = "Run YAML browser-automation recipes with Playwright: open pages, click, fill, extract, screenshot, download."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
keywords = ["browser-automation", "web-scraping", "playwright", "mcp", "yaml"]
dependencies = [
    "mcp>=1,<2",
    "orjson>=3.13.0",
    "playwright>=1.65.0",
    "pyyaml>=6.0.3",
]
